# The power-off goes through the hibernation path, which leaves USB armed to wake the board
# (/etc/bc250-sleep/bc250-poweroff). If that returns or fails, systemd powers off as usual.
[Unit]
FailureAction=poweroff-force

[Service]
Type=oneshot
ExecStart=-/etc/bc250-sleep/bc250-poweroff
TimeoutStartSec=180
